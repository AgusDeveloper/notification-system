name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  IMAGE_NAME: notification-system
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode clean verify

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: notification-system-jar
          path: target/*.jar
          if-no-files-found: error

  package-image:
    name: Package Docker image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: notification-system-jar
          path: target

      - name: Build image
        run: docker build --tag $IMAGE_NAME:$IMAGE_TAG --tag $IMAGE_NAME:latest .

      - name: Smoke test image metadata
        run: docker image inspect $IMAGE_NAME:$IMAGE_TAG

  local-production-contract:
    name: Local production contract
    runs-on: ubuntu-latest
    needs: package-image
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run local CI/CD simulation
        run: ./scripts/local-cicd.sh --no-cache
